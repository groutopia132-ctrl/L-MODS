<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L MODS || OFFICIAL</title><style>*{box-sizing:border-box}body{margin:0;background:#100e19;color:#fff;font:15px system-ui}main,header{max-width:900px;margin:auto;padding:18px}header{display:flex;align-items:center;gap:12px}h1{font-size:20px;flex:1}#avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#392b50;display:grid;place-items:center}input,textarea,button{font:inherit;border:1px solid #423653;border-radius:12px;padding:12px;background:#211b30;color:white}input,textarea{width:100%;margin:5px 0}button{cursor:pointer;background:#6043a0}button.secondary{background:#211b30}a{color:#d4c1ff}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.item,section{background:#211b30;border:1px solid #382d49;border-radius:16px;padding:14px;margin-bottom:12px}.item img{width:100%;aspect-ratio:1.5;object-fit:cover;border-radius:10px}.item h3{overflow-wrap:anywhere}small,p{color:#c8bfd5;overflow-wrap:anywhere}dialog{background:#211b30;color:white;border:1px solid #514064;border-radius:16px;width:min(92%,500px);max-height:90vh;overflow:auto}dialog::backdrop{background:#000a}[hidden]{display:none!important}#status{white-space:pre-wrap}label{display:block;margin-top:8px}</style></head><body><header><div id="avatar">LM</div><h1 id="brand">L MODS || OFFICIAL</h1><button class="secondary" id="menu">☰</button></header><main><p id="description"></p><input id="search" placeholder="Cari aplikasi..." aria-label="Cari aplikasi"><h2>🔥 Update Terbaru</h2><p id="status" role="status"></p><div id="grid"></div><section id="admin" hidden><h2>Admin Panel</h2><button id="logout">Keluar</button><h3>Tambah / edit aplikasi</h3><form id="appform"><input name="name" placeholder="Nama aplikasi" required><input name="version" placeholder="Versi"><textarea name="mod_info" placeholder="Mod Info"></textarea><input name="image_url" placeholder="URL foto" type="url"><label>Atau upload foto<input name="photo" type="file" accept="image/*"></label><input name="download_url" placeholder="Link download" type="url" required><button>Simpan aplikasi</button> <button type="button" class="secondary" id="clear">Batal edit</button></form><div id="manage"></div><h3>Pengaturan website</h3><form id="settingsform"><label>Nama brand<input name="brand_name"></label><label>Deskripsi<textarea name="description"></textarea></label><label>URL profil<input name="profile_url" type="url"></label><label>Upload profil<input name="photo" type="file" accept="image/*"></label><label>Link iklan<input name="ad_url" type="url"></label><label>Link tutorial<input name="tutorial_url" type="url"></label><label>Link Telegram<input name="telegram_url" type="url"></label><button>Simpan pengaturan</button></form></section></main><dialog id="nav"><h2>Menu</h2><div id="links"></div><button id="loginopen">Login owner</button> <button class="secondary" onclick="this.closest('dialog').close()">Tutup</button></dialog><dialog id="login"><form id="loginform"><h2>Login owner</h2><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Masuk</button> <button type="button" class="secondary" onclick="this.closest('dialog').close()">Batal</button><p id="loginstatus"></p></form></dialog><dialog id="download"><h2 id="downloadtitle"></h2><p id="downloadinfo"></p><div id="downloadlinks"></div><button class="secondary" onclick="this.closest('dialog').close()">Tutup</button></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id);const db=supabase.createClient('https://dbvdcyliixckvgehuusr.supabase.co','sb_publishable_mk3GTw_yptCah-66TyT6HQ_B9YxdIx_');let apps=[],settings={},editing=null;function url(s){try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}function el(tag,t){let e=document.createElement(tag);if(t)e.textContent=t;return e}function link(t,u){let a=el('a',t);a.href=url(u);a.target='_blank';a.rel='noopener noreferrer';a.style.display='block';a.style.margin='12px 0';return a}function btn(t,f){let b=el('button',t);b.onclick=f;return b}function check(r){if(r.error)throw r.error;return r.data}function report(e){$('status').textContent=e.message||String(e)}async function safe(f){try{await f()}catch(e){report(e)}}function render(){let g=$('grid');g.replaceChildren();for(let a of apps.filter(a=>a.name.toLowerCase().includes($('search').value.toLowerCase()))){let c=el('article');c.className='item';if(url(a.image_url)){let i=el('img');i.src=url(a.image_url);i.loading='lazy';i.alt=a.name;c.append(i)}c.append(el('h3',a.name),el('small',a.version),el('p',a.mod_info),btn('Detail / Download',()=>detail(a)));g.append(c)}if(!g.children.length)g.append(el('p','Belum ada aplikasi.'));}function detail(a){$('downloadtitle').textContent=a.name;$('downloadinfo').textContent=a.mod_info;let d=$('downloadlinks');d.replaceChildren();if(url(settings.ad_url))d.append(link('Lihat sponsor (opsional)',settings.ad_url));if(url(a.download_url))d.append(link('📥 Lanjut ke download',a.download_url));if(url(settings.tutorial_url))d.append(link('Cara download',settings.tutorial_url));$('download').showModal()}async function load(){apps=check(await db.from('apps').select('*').order('created_at',{ascending:false}));settings=check(await db.from('settings').select('*').eq('id',1).single());$('brand').textContent=settings.brand_name||'L MODS || OFFICIAL';$('description').textContent=settings.description||'';$('avatar').replaceChildren();if(url(settings.profile_url)){let i=el('img');i.src=url(settings.profile_url);i.style='width:48px;height:48px;border-radius:50%;object-fit:cover';$('avatar').append(i)}else $('avatar').textContent='LM';$('links').replaceChildren();for(let [t,k] of [['Telegram','telegram_url'],['Cara download','tutorial_url']])if(url(settings[k]))$('links').append(link(t,settings[k]));render();if(!$('admin').hidden)manage()}
async function owner(){let {data:{user}}=await db.auth.getUser();if(!user)return false;let r=await db.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();return !r.error&&!!r.data}async function auth(){let yes=await owner();$('admin').hidden=!yes;$('loginopen').hidden=yes;if(yes){for(let k of ['brand_name','description','profile_url','ad_url','tutorial_url','telegram_url'])$('settingsform').elements[k].value=settings[k]||'';manage()}return yes}function manage(){let m=$('manage');m.replaceChildren();for(let a of apps){let p=el('p',a.name+' ');p.append(btn('Edit',()=>{editing=a.id;for(let k of ['name','version','mod_info','image_url','download_url'])$('appform').elements[k].value=a[k]||'';$('appform').scrollIntoView()}),btn('Hapus',()=>safe(async()=>{if(confirm('Hapus '+a.name+'?')){check(await db.from('apps').delete().eq('id',a.id));await load()}})));m.append(p)}}async function upload(f){if(!f||!f.size)return '';if(!['image/png','image/jpeg','image/webp','image/gif'].includes(f.type)||f.size>5*1024*1024)throw Error('Foto harus PNG/JPG/WebP/GIF maksimal 5 MB');let path=crypto.randomUUID()+'.'+f.type.split('/')[1];check(await db.storage.from('images').upload(path,f));return db.storage.from('images').getPublicUrl(path).data.publicUrl}function values(form,keys){let o={};for(let k of keys)o[k]=form.elements[k].value.trim();return o}$('appform').onsubmit=e=>{e.preventDefault();safe(async()=>{let f=e.target,o=values(f,['name','version','mod_info','image_url','download_url']);if(!url(o.download_url))throw Error('Link download tidak valid');o.image_url=await upload(f.elements.photo.files[0])||o.image_url;check(await(editing===null?db.from('apps').insert(o):db.from('apps').update(o).eq('id',editing)));editing=null;f.reset();await load();$('status').textContent='Aplikasi disimpan.'})};$('settingsform').onsubmit=e=>{e.preventDefault();safe(async()=>{let f=e.target,o=values(f,['brand_name','description','profile_url','ad_url','tutorial_url','telegram_url']);o.profile_url=await upload(f.elements.photo.files[0])||o.profile_url;check(await db.from('settings').update(o).eq('id',1));await load();await auth();$('status').textContent='Pengaturan disimpan.'})};$('clear').onclick=()=>{editing=null;$('appform').reset()};$('search').oninput=render;$('menu').onclick=()=>$('nav').showModal();$('loginopen').onclick=()=>{$('nav').close();$('login').showModal()};$('loginform').onsubmit=async e=>{e.preventDefault();try{let f=e.target;check(await db.auth.signInWithPassword({email:f.elements.email.value,password:f.elements.password.value}));if(!await auth()){await db.auth.signOut();throw Error('Akun bukan admin');}f.reset();$('login').close();$('admin').scrollIntoView()}catch(e){$('loginstatus').textContent=e.message}};$('logout').onclick=()=>safe(async()=>{check(await db.auth.signOut());await auth()});safe(async()=>{await load();await auth()});</script></body></html>
